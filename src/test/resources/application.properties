# Test-only config to avoid external env var dependencies
spring.datasource.url=jdbc:h2:mem:fixall_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Minimal required app properties for context startup
jwt.secret=test-secret
jwt.expiry-ms=3600000
stripe.secret=test
firebase.project-id=test
google.maps.key=test

