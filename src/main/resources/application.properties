spring.application.name=Fixall Backend
# Load local environment values from .env in development
spring.config.import=optional:file:.env[.properties]
# ?? Server ??????????????????????????????????????????????????
server.port=8080
# ?? Database ?????????????????????????????????????????????????
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# ?? JPA / Hibernate ??????????????????????????????????????????
# "update" creates tables automatically on first run
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ?? File uploads ?????????????????????????????????????????????
# Allow uploads up to 20MB (for ID documents and photos)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ?? JWT ??????????????????????????????????????????????????????
jwt.secret=${JWT_SECRET}
jwt.expiry-ms=${JWT_EXPIRY_MS}

# ?? Stripe ???????????????????????????????????????????????????
stripe.secret=${STRIPE_SECRET}

# ?? Firebase ?????????????????????????????????????????????????
firebase.project-id=${FIREBASE_PROJECT_ID}

# ?? Google Maps ??????????????????????????????????????????????
google.maps.key=${GOOGLE_MAPS_KEY}
